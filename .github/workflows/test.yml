name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Database tests only run when a test database is connected (a repository secret named TEST_DATABASE_URL).
      - name: Database tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
